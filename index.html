<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Маршруты в сервисные центры</title><link rel="stylesheet" href="style.css"></head><body><header><strong>Доставка в сервисные центры</strong><span>Заявки и маршрутный лист водителя</span></header><main><section><h2>Новая заявка</h2><form id="form"><label for="tool">Инструмент *</label><input id="tool" required placeholder="Например, перфоратор Bosch GBH 2-26"><label for="address">Адрес сервисного центра *</label><input id="address" required placeholder="Город, улица, дом"><label for="phone">Телефон СЦ *</label><input id="phone" required type="tel" placeholder="+7 999 123-45-67"><label for="ticket">Номер обращения</label><input id="ticket" placeholder="Для сверки с 1С"><label for="comment">Комментарий водителю</label><textarea id="comment" placeholder="Контактное лицо, время приёма, что передать"></textarea><p><button type="submit">Добавить точку</button></p></form><div class="export"><label for="origin">Откуда выезжает водитель</label><input id="origin" placeholder="Город, улица, дом"><p class="fieldhint">Для автоматического порядка точек укажите полный адрес отправления.</p><div class="row" style="margin-top:16px"><button id="optimize" type="button">Построить порядок</button><button id="reset" class="secondary" type="button">Исходный порядок</button></div><div id="message" class="message" role="status"></div></div></section><section><div class="row top"><div><h2 style="margin-bottom:5px">Маршрутный лист</h2><div id="summary" class="meta"></div></div><span class="pill" id="date"></span></div><div class="row controls"><button id="excel" type="button" class="secondary">Скачать для Excel</button><button id="print" type="button" class="secondary">Печать</button></div><div id="stops" class="stops"></div></section></main><script src="script.js"></script></body></html>
